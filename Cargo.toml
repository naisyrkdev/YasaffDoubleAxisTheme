[package]
name = "yasaff-double-axis-theme"
version = "1.0.0"
edition = "2024"
license-file = "LICENSE"

[lib]
# cdylib is the theme.wasm YASAFF loads; rlib lets `cargo test` run on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
